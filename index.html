let watch=JSON.parse(localStorage.getItem(key)||'[]'), history=JSON.parse(localStorage.getItem(hist)||'[]'), recentSearches=JSON.parse(localStorage.getItem(recentSearchKey)||'[]'), recentViewed=JSON.parse(localStorage.getItem(recentViewedKey)||'[]');

function go(page,arg=''){location.hash='#/'+page+(arg?'/'+encodeURIComponent(arg):'')}
function backFromDetails(){window.scrollTo(0,0);location.hash='#/home';render('home')}
function posterSrc(m){return m.omdb?m.poster:url(m.poster)}

function section(title,list,action=''){return '<section class="section"><div class="sectionHead"><h2>'+title+'</h2>'+(action?'<button class="muted" onclick="'+action+'">See all</button>':'')+'</div>'+cards(list)+'</section>'}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function dayStamp(){return new Date().toISOString().slice(0,10)}
function dailyOrder(list){let ids=list.map(x=>x.id), saved=JSON.parse(sessionStorage.getItem(sessionOrderKey)||'null');if(!saved||saved.length!==ids.length||saved.some(id=>!ids.includes(id))){saved=shuffle(ids);sessionStorage.setItem(sessionOrderKey,JSON.stringify(saved))}return saved.map(id=>list.find(x=>x.id===id)).filter(Boolean)}

function home(){let all=rotateRows(movies), hero=all[0]||movies[0], heroImg=hero&&hero.omdb&&hero.poster&&hero.poster!=='N/A'?hero.poster:'';return '<div class="hero" style="'+(heroImg?'background:linear-gradient(90deg,#101015 0%,#101015c9 42%,#10101522 75%),url(\''+heroImg+'\') center/cover':'')+'"><div class="heroText"><div class="eyebrow">Tonight\'s pick</div><h1>'+esc(hero.title)+'</h1><p>'+esc(hero.desc||'Find something worth watching.')+'</p><div class="actions"><button class="btn" onclick="'+(hero.omdb?'loadOmdb(\''+hero.id+'\')':'detail(\''+hero.id+'\')')+'">▶ View details</button></div></div></div>'+section('Trending now',rotateRows(movies).slice(0,6),'go(\'discover\')')+section('Popular this week',rotateRows(movies).slice(0,6))+section('Top rated picks',[...movies].sort((a,b)=>(Number(b.rating)||0)-(Number(a.rating)||0)).slice(0,6))+section('More to explore',rotateRows(movies).slice(0,6))+'<section class="section"><div class="sectionHead"><h2>Browse by genre</h2></div><div class="chips">'+genres.map(g=>'<button class="chip" onclick="go(\'genre\',\''+g+'\')">'+g+'</button>').join('')+'</div></section>'}

function genre(g){let list=movies.filter(m=>m.genre.toLowerCase()==g.toLowerCase());return '<h1 class="pageTitle">'+g+'</h1><p class="muted">Movies and shows in '+g+'.</p><div class="section">'+(list.length?cards(list):'<div class="empty">No titles in this genre yet.</div>')+'</div>'}
function searchPage(q=''){let list=movies.filter(m=>(m.title+' '+m.genre+' '+m.type).toLowerCase().includes(q.toLowerCase()));return '<h1 class="pageTitle">Search</h1><p class="muted">'+(q?'Results for “'+esc(q)+'”':'Search the Netfinder catalog.')+'</p><div class="section">'+(list.length?cards(list):'<div class="empty">No matches found.</div>')+'</div>'}
function detail(id){let m=movies.find(x=>x.id===id);if(!m)return;history=[m.id,...history.filter(x=>x!==m.id)].slice(0,20);save();render('movie',id)}
function details(m){let inList=watch.includes(m.id);return '<div class="detail"><div class="detailPoster"><img src="'+url(m.poster,900)+'" alt="'+esc(m.title)+'"></div><div><div class="eyebrow">'+m.type+' · '+m.genre+'</div><h1>'+m.title+'</h1><div class="kv"><span>'+m.year+'</span><span>★ '+m.rating+'/10</span><span>HD</span></div><p>'+m.desc+'</p><div class="actions"><button class="btn" onclick="toggleWatch(\''+m.id+'\')">'+(inList?'✓ In my list':'＋ Add to my list')+'</button><button class="btn alt" onclick="backFromDetails()">← Back</button></div><div class="section"><h2>About this title</h2><p>Netfinder uses a lightweight catalog in this standalone build. Connect a movie-data provider later without changing the interface.</p></div></div></div>'}

function settings(){return '<h1 class="pageTitle">Settings</h1><div class="empty" style="text-align:left"><h2>Netfinder</h2><p class="muted">Standalone, installable movie discovery app.</p><hr style="border-color:var(--line);border-width:1px 0 0;margin:25px 0"><p><b>Offline shell</b><br><span class="muted">The app shell is cached for repeat visits.</span></p><p><b>Your data</b><br><span class="muted">Watchlist and history stay in this browser.</span></p><button class="btn" onclick="localStorage.clear();watch=[];history=[];toast(\'Local data cleared\');render()">Clear local data</button></div>'}

function personalizationTerms(){let words=recentSearches.slice(0,6).flatMap(q=>q.toLowerCase().split(/\s+/)).filter(w=>w.length>2), viewed=recentViewed.slice(0,4).flatMap(x=>x.title.toLowerCase().split(/\s+/)).filter(w=>w.length>3);return [...new Set([...words,...viewed])].slice(0,5)}
async function hydrateHome(){let cached=JSON.parse(localStorage.getItem(catalogKey)||'[]'), cachedDay=localStorage.getItem(catalogDayKey), today=dayStamp();if(cached.length){movies=cached;if((location.hash.replace(/^#\//,'').split('/')[0]||'home')==='home')render('home')}if(cachedDay===today&&cached.length)return;let base=['movie','love','night','world','life'], tailored=personalizationTerms(), terms=[...new Set([...tailored,...base])].slice(0,8);try{let jobs=terms.map(q=>fetch(OMDB+'?apikey='+OMDB_KEY+'&s='+encodeURIComponent(q)+'&type=movie&page=1').then(r=>r.json()).catch(()=>null)),batches=await Promise.all(jobs),seen=new Set(),live=[];batches.forEach(d=>(d&&d.Response==='True'?d.Search:[]).forEach(x=>{if(!seen.has(x.imdbID)&&x.Poster&&x.Poster!=='N/A'){seen.add(x.imdbID);live.push({id:x.imdbID,title:x.Title,year:x.Year,genre:'Movie',rating:'—',poster:x.Poster,desc:'Open for full plot, ratings, cast and movie details from OMDb.',type:x.Type||'movie',omdb:true})}}));if(live.length){movies=live.slice(0,60);localStorage.setItem(catalogKey,JSON.stringify(movies));localStorage.setItem(catalogDayKey,today);sessionStorage.removeItem(sessionOrderKey);let p=location.hash.replace(/^#\//,'').split('/')[0]||'home';if(p==='home'||p==='discover')render(p)}}catch(e){console.warn('OMDb daily catalog load failed',e)}}
function recentSearchHtml(){let viewed=recentViewed.slice(0,6).map(x=>'<button class="chip" onclick="loadOmdb(\''+x.id+'\')">'+esc(x.title)+'</button>').join(''), searched=recentSearches.slice(0,8).map(q=>'<button class="chip" onclick="useRecentSearch(\''+q.replace(/'/g,"\\'")+'\')">⌕ '+esc(q)+'</button>').join('');return (searched?'<section class="section" style="margin-top:18px"><h2>Recently searched</h2><div class="chips" style="margin-top:12px">'+searched+'</div></section>':'')+(viewed?'<section class="section" style="margin-top:25px"><h2>Recently viewed</h2><div class="chips" style="margin-top:12px">'+viewed+'</div></section>':'')+(!searched&&!viewed?'<div class="searchHint">Start typing to search OMDb.</div>':'')}
function openSearch(){let o=document.getElementById('searchOverlay');o.classList.add('open');document.getElementById('searchResults').innerHTML=recentSearchHtml();setTimeout(()=>document.getElementById('overlaySearch').focus(),50)}
function useRecentSearch(q){let input=document.getElementById('overlaySearch');input.value=q;searchOmdb(q)}
function closeSearch(){document.getElementById('searchOverlay').classList.remove('open')}
function omdbCard(m){let poster=m.Poster&&m.Poster!=='N/A'?m.Poster:'';return '<article class="card" onclick="loadOmdb(\''+m.imdbID+'\')"><div class="poster">'+(poster?'<img loading="lazy" src="'+poster+'" alt="">':'<div class="empty" style="height:100%;padding:30px 8px">No poster</div>')+'</div><h3>'+esc(m.Title)+'</h3><p class="meta">'+(m.Year||'')+' · '+(m.Type||'')+'</p></article>'}
let searchTimer;document.getElementById('overlaySearch').addEventListener('input',e=>{clearTimeout(searchTimer);let q=e.target.value.trim();if(q.length<2){document.getElementById('searchResults').innerHTML='<div class="searchHint">Type at least 2 characters.</div>';return}searchTimer=setTimeout(()=>searchOmdb(q),300)});
async function searchOmdb(q){recentSearches=[q,...recentSearches.filter(x=>x.toLowerCase()!==q.toLowerCase())].slice(0,10);localStorage.setItem(recentSearchKey,JSON.stringify(recentSearches));let box=document.getElementById('searchResults');box.innerHTML='<div class="searchHint">Searching…</div>';try{let r=await fetch(OMDB+'?apikey='+OMDB_KEY+'&s='+encodeURIComponent(q));let d=await r.json();box.innerHTML=d.Response==='True'?'<div class="grid">'+d.Search.map(omdbCard).join('')+'</div>':'<div class="empty">'+esc(d.Error||'No matches found.')+'</div>'}catch(e){box.innerHTML='<div class="empty">Could not reach OMDb.</div>'}}
async function loadOmdb(id){try{let r=await fetch(OMDB+'?apikey='+OMDB_KEY+'&i='+encodeURIComponent(id)+'&plot=full');let d=await r.json();if(d.Response!=='True')throw 0;let m={...d,id:d.imdbID,title:d.Title,year:d.Year,genre:d.Genre||'N/A',rating:d.imdbRating&&d.imdbRating!=='N/A'?d.imdbRating:'—',poster:d.Poster,desc:d.Plot&&d.Plot!=='N/A'?d.Plot:'No plot available.',type:d.Type||'Movie',rated:d.Rated,runtime:d.Runtime,director:d.Director,actors:d.Actors};recentViewed=[{id:m.id,title:m.title},...recentViewed.filter(x=>x.id!==m.id)].slice(0,12);localStorage.setItem(recentViewedKey,JSON.stringify(recentViewed));closeSearch();document.getElementById('app').innerHTML=omdbDetails(m);window.scrollTo(0,0)}catch(e){toast('Could not load title')}}
function omdbDetails(m){let poster=m.poster&&m.poster!=='N/A'?m.poster:'',val=v=>v&&v!=='N/A'?esc(String(v)):'—',ratings=(m.Ratings||[]).map(r=>'<div class="infoBox"><b>'+val(r.Value)+'</b><span class="muted">'+val(r.Source)+'</span></div>').join('');setTimeout(()=>{let hero=document.querySelector('.detailHero');if(!hero)return;let watchScroll=()=>hero.classList.toggle('compact',window.scrollY>220);window.addEventListener('scroll',watchScroll,{passive:true});watchScroll()},0);let inList=watch.includes(m.id);return '<div class="movieDetail"><div class="detailHeroSpace"></div><div class="detailHero">'+(poster?'<img src="'+poster+'" alt="'+esc(m.title)+'">':'')+'<button class="btn alt detailHeroBack" onclick="go(\'home\')">← Back</button><div class="detailHeroTitle"><div class="eyebrow">'+val(m.type)+' · '+val(m.genre)+'</div><h1>'+esc(m.title)+'</h1><div class="kv"><span>'+val(m.year)+'</span><span class="ratingHero">★ '+val(m.rating)+'/10</span><span>'+val(m.runtime)+'</span><span>'+val(m.rated)+'</span></div></div></div><div class="detailBody"><div class="detailActions"><button id="detailWatchBtn" class="btn" onclick="toggleWatch(\''+m.id+'\')">'+(inList?'✓ In My List':'＋ Add to My List')+'</button><button class="btn alt" onclick="openSearch()">⌕ Search</button></div><section class="section" style="margin-top:12px"><h2>Storyline</h2><p style="font-size:1.08rem">'+val(m.desc)+'</p></section><section class="section"><h2>Ratings</h2><div class="detailInfoGrid" style="margin-top:16px">'+(ratings||'<div class="infoBox">No ratings available.</div>')+'</div></section><section class="section"><h2>Cast & crew</h2><div class="detailInfoGrid" style="margin-top:16px"><div class="infoBox"><b>Director</b>'+val(m.Director)+'</div><div class="infoBox"><b>Writer</b>'+val(m.Writer)+'</div><div class="infoBox" style="grid-column:1/-1"><b>Actors</b>'+val(m.Actors)+'</div></div></section><section class="section"><h2>Movie information</h2><div class="detailInfoGrid" style="margin-top:16px"><div class="infoBox"><b>Released</b>'+val(m.Released)+'</div><div class="infoBox"><b>Language</b>'+val(m.Language)+'</div><div class="infoBox"><b>Country</b>'+val(m.Country)+'</div><div class="infoBox"><b>Awards</b>'+val(m.Awards)+'</div><div class="infoBox"><b>Box office</b>'+val(m.BoxOffice)+'</div><div class="infoBox"><b>Production</b>'+val(m.Production)+'</div><div class="infoBox"><b>DVD</b>'+val(m.DVD)+'</div><div class="infoBox"><b>Metascore</b>'+val(m.Metascore)+'</div></div></section><section class="section"><h2>IMDb</h2><div class="detailInfoGrid" style="margin-top:16px"><div class="infoBox"><b>IMDb rating</b>'+val(m.imdbRating)+'</div><div class="infoBox"><b>Votes</b>'+val(m.imdbVotes)+'</div><div class="infoBox"><b>IMDb ID</b>'+val(m.imdbID)+'</div>'+(m.totalSeasons&&m.totalSeasons!=='N/A'?'<div class="infoBox"><b>Total seasons</b>'+val(m.totalSeasons)+'</div>':'')+'</div></section></div></div>'}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSearch()});window.addEventListener('hashchange',()=>render());render();
let deferred;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;document.getElementById('install').style.display='block'});document.getElementById('install').onclick=async()=>{if(deferred){deferred.prompt();await deferred.userChoice;deferred=null;document.getElementById('install').style.display='none'}};
hydrateHome();
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
