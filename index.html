<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08080b"><meta name="description" content="Netfinder — Find something worth watching.">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./netfinder.svg"><title>Netfinder</title>
<style>
:root{--bg:#08080b;--panel:#111116;--panel2:#17171e;--text:#f7f7fa;--muted:#a3a3ad;--line:#ffffff12;--accent:#fff;--max:1380px}
*{box-sizing:border-box}html{background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{margin:0;background:radial-gradient(900px 500px at 75% -10%,#25253155,transparent 65%),var(--bg);min-width:320px}button,input{font:inherit}button{border:0;color:inherit;cursor:pointer}a{color:inherit;text-decoration:none}
.top{position:sticky;top:0;z-index:20;background:#08080bdd;backdrop-filter:blur(22px);border-bottom:1px solid var(--line)}.bar{height:70px;max-width:var(--max);margin:auto;padding:0 22px;display:flex;align-items:center;gap:25px}.logo{font-size:22px;font-weight:850;letter-spacing:-.8px}.logo span{opacity:.48}.nav{display:flex;gap:5px}.nav button,.iconbtn{background:transparent;padding:10px 12px;border-radius:12px;color:var(--muted)}.nav button:hover,.nav .on,.iconbtn:hover{background:var(--panel2);color:var(--text)}.search{margin-left:auto;width:min(300px,34vw);position:relative}.search input{width:100%;background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:13px;padding:11px 14px 11px 38px;outline:0}.search input:focus{border-color:#ffffff30}.search i{position:absolute;left:13px;top:11px;color:var(--muted);font-style:normal}.main{max-width:var(--max);margin:auto;padding:26px 22px 100px}.hero{min-height:460px;border-radius:28px;overflow:hidden;position:relative;background:linear-gradient(90deg,#101015 0%,#101015c9 42%,#10101522 75%),url("https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?auto=format&fit=crop&w=1800&q=85") center/cover}.hero:after{content:"";position:absolute;inset:auto 0 0;height:35%;background:linear-gradient(transparent,var(--bg))}.heroText{position:absolute;z-index:2;left:42px;bottom:48px;max-width:620px}.eyebrow{text-transform:uppercase;letter-spacing:2px;font-size:11px;font-weight:800;color:#bbb;margin-bottom:12px}.hero h1{font-size:clamp(40px,6vw,76px);line-height:.92;letter-spacing:-4px;margin:0 0 20px}.hero p{color:#d0d0d5;max-width:520px;line-height:1.55}.actions{display:flex;gap:10px;flex-wrap:wrap}.btn{padding:12px 18px;border-radius:13px;font-weight:750;background:#fff;color:#09090b}.btn.alt{background:#ffffff14;color:#fff;border:1px solid #ffffff16}.section{margin-top:38px}.sectionHead{display:flex;align-items:end;justify-content:space-between;margin-bottom:16px}.section h2{font-size:21px;margin:0;letter-spacing:-.5px}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:16px}.card{min-width:0;cursor:pointer}.poster{aspect-ratio:2/3;border-radius:15px;overflow:hidden;background:#18181d;position:relative;border:1px solid #ffffff08}.poster img{width:100%;height:100%;object-fit:cover;transition:transform .35s}.card:hover .poster img{transform:scale(1.04)}.poster .tag{position:absolute;top:9px;left:9px;background:#09090bdd;border:1px solid #fff2;border-radius:8px;padding:5px 7px;font-size:10px;font-weight:800}.card h3{font-size:14px;margin:9px 2px 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{font-size:12px;color:var(--muted);margin:0 2px}.chips{display:flex;gap:9px;overflow:auto;padding-bottom:5px}.chip{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:9px 14px;white-space:nowrap;color:#d5d5da}.detail{display:grid;grid-template-columns:280px 1fr;gap:34px;max-width:1000px;margin:35px auto}.detailPoster{border-radius:18px;overflow:hidden}.detailPoster img{width:100%}.detail h1{font-size:clamp(34px,5vw,62px);letter-spacing:-2.5px;margin:0 0 10px}.detail p{line-height:1.7;color:#c5c5cc}.kv{display:flex;gap:18px;flex-wrap:wrap;color:var(--muted);font-size:13px}.pageTitle{font-size:40px;letter-spacing:-2px;margin:15px 0 24px}.empty{text-align:center;padding:80px 20px;color:var(--muted);background:var(--panel);border-radius:20px}.footer{text-align:center;color:#666;padding:35px 0;font-size:12px}.toast{position:fixed;left:50%;bottom:25px;transform:translate(-50%,20px);opacity:0;z-index:50;background:#fff;color:#09090b;padding:12px 16px;border-radius:12px;font-weight:750;transition:.25s;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}.install{position:fixed;right:18px;bottom:18px;z-index:30;background:#fff;color:#08080b;padding:12px 16px;border-radius:13px;font-weight:800;box-shadow:0 12px 40px #0008;display:none}.mobileNav{display:none}
@media(max-width:1050px){.grid{grid-template-columns:repeat(5,1fr)}}
@media(max-width:780px){.bar{height:62px;padding:0 15px}.nav{display:none}.search{width:150px}.main{padding:16px 15px 90px}.hero{min-height:500px;border-radius:22px}.heroText{left:24px;right:20px;bottom:32px}.hero h1{letter-spacing:-2.5px}.grid{grid-template-columns:repeat(3,1fr);gap:12px}.detail{grid-template-columns:120px 1fr;gap:18px}.detail h1{font-size:30px;letter-spacing:-1px}.detail p{font-size:14px}.mobileNav{position:fixed;display:flex;bottom:0;left:0;right:0;height:66px;z-index:25;background:#0b0b0ee8;backdrop-filter:blur(20px);border-top:1px solid var(--line);justify-content:space-around}.mobileNav button{background:none;color:var(--muted);font-size:11px;padding:8px 15px}.mobileNav button.on{color:#fff}.mobileNav b{display:block;font-size:20px;line-height:22px}.pageTitle{font-size:34px}}
@media(max-width:430px){.search{width:125px}.grid{grid-template-columns:repeat(2,1fr)}.detail{grid-template-columns:1fr}.detailPoster{width:150px}.hero{min-height:540px}}
</style></head><body>
<header class="top"><div class="bar"><button class="logo" onclick="go('home')">net<span>finder</span></button><nav class="nav" id="nav"></nav><div class="search"><i>⌕</i><input id="search" placeholder="Search movies & shows" autocomplete="off"></div></div></header>
<main class="main" id="app"></main><nav class="mobileNav" id="mobileNav"></nav><button class="install" id="install">Install Netfinder</button><div class="toast" id="toast"></div>
<script>
const IMG='https://images.unsplash.com/photo-';
const movies=[
{id:'1',title:'The Silent Hour',year:2026,genre:'Thriller',rating:8.2,poster:'photo-1489599849927-2ee91cede3ba',back:'photo-1489599849927-2ee91cede3ba',desc:'A detective races through one impossible night when every second carries a consequence.',type:'Movie'},
{id:'2',title:'Neon Horizon',year:2025,genre:'Sci-Fi',rating:8.7,poster:'photo-1518709268805-4e9042af9f23',desc:'A crew follows a signal beyond the edge of mapped space.',type:'Movie'},
{id:'3',title:'After Midnight',year:2024,genre:'Mystery',rating:7.9,poster:'photo-1485846234645-a62644f84728',desc:'Three strangers discover that their stories are connected by a vanished film.',type:'Movie'},
{id:'4',title:'The Last Kingdom',year:2025,genre:'Drama',rating:8.5,poster:'photo-1500530855697-b586d89ba3ee',desc:'Power shifts when an old family secret reaches the throne.',type:'TV'},
{id:'5',title:'Wild Static',year:2026,genre:'Action',rating:7.8,poster:'photo-1518609878373-06d740f60d8b',desc:'A rescue pilot is pulled into a race across a storm-struck continent.',type:'Movie'},
{id:'6',title:'Blue Room',year:2023,genre:'Drama',rating:8.0,poster:'photo-1516321318423-f06f85e504b3',desc:'A quiet story about friendship, memory and starting again.',type:'Movie'},
{id:'7',title:'Orbit Seven',year:2025,genre:'Sci-Fi',rating:8.1,poster:'photo-1446776811953-b23d57bd21aa',desc:'A station crew receives a message from Earth that should not exist.',type:'TV'},
{id:'8',title:'Blackwater',year:2024,genre:'Crime',rating:8.3,poster:'photo-1500534623283-312aade485b7',desc:'A missing ledger exposes a city-wide criminal network.',type:'Movie'},
{id:'9',title:'Parallel',year:2026,genre:'Sci-Fi',rating:8.6,poster:'photo-1440404653325-ab127d49abc1',desc:'Two versions of the same city begin to overlap.',type:'Movie'},
{id:'10',title:'Paper Moon',year:2022,genre:'Romance',rating:7.6,poster:'photo-1519741497674-611481863552',desc:'A chance meeting becomes an unexpected second beginning.',type:'Movie'},
{id:'11',title:'The North Line',year:2025,genre:'Adventure',rating:8.0,poster:'photo-1464822759023-fed622ff2c3b',desc:'A team crosses an unforgiving frontier to reach a lost settlement.',type:'Movie'},
{id:'12',title:'Static Hearts',year:2024,genre:'Romance',rating:7.7,poster:'photo-1516589178581-6cd7833ae3b2',desc:'Two musicians find each other while trying to find their sound.',type:'Movie'}
];
const url=(id,w=700)=>'https://images.unsplash.com/'+id+'?auto=format&fit=crop&w='+w+'&q=82';
const key='netfinder-watchlist', hist='netfinder-history';
let watch=JSON.parse(localStorage.getItem(key)||'[]'), history=JSON.parse(localStorage.getItem(hist)||'[]');
const genres=['Action','Adventure','Comedy','Crime','Drama','Horror','Mystery','Romance','Sci-Fi','Thriller'];
function save(){localStorage.setItem(key,JSON.stringify(watch));localStorage.setItem(hist,JSON.stringify(history))}
function go(page,arg=''){location.hash='#/'+page+(arg?'/'+encodeURIComponent(arg):'')}
function card(m){return '<article class="card" onclick="detail(\''+m.id+'\')"><div class="poster"><img loading="lazy" src="'+url(m.poster)+'" alt=""><span class="tag">★ '+m.rating+'</span></div><h3>'+m.title+'</h3><p class="meta">'+m.year+' · '+m.genre+'</p></article>'}
function cards(list){return '<div class="grid">'+list.map(card).join('')+'</div>'}
function section(title,list,action=''){return '<section class="section"><div class="sectionHead"><h2>'+title+'</h2>'+(action?'<button class="muted" onclick="'+action+'">See all</button>':'')+'</div>'+cards(list)+'</section>'}
function home(){return '<div class="hero"><div class="heroText"><div class="eyebrow">Tonight\'s pick</div><h1>The Silent Hour</h1><p>A detective races through one impossible night when every second carries a consequence.</p><div class="actions"><button class="btn" onclick="detail(\'1\')">▶ Watch details</button><button class="btn alt" onclick="toggleWatch(\'1\')">＋ My list</button></div></div></div>'+section('Trending now',movies.slice(0,6),'go(\'discover\')')+section('Popular this week',movies.slice(6,12))+ '<section class="section"><div class="sectionHead"><h2>Browse by genre</h2></div><div class="chips">'+genres.map(g=>'<button class="chip" onclick="go(\'genre\',\''+g+'\')">'+g+'</button>').join('')+'</div></section>'}
function discover(){return '<h1 class="pageTitle">Discover</h1><div class="chips">'+['All',...genres].map(g=>'<button class="chip" onclick="filterGenre(\''+g+'\')">'+g+'</button>').join('')+'</div><div id="discoverGrid" class="section">'+cards(movies)+'</div>'}
function genre(g){let list=movies.filter(m=>m.genre.toLowerCase()==g.toLowerCase());return '<h1 class="pageTitle">'+g+'</h1><p class="muted">Movies and shows in '+g+'.</p><div class="section">'+(list.length?cards(list):'<div class="empty">No titles in this genre yet.</div>')+'</div>'}
function searchPage(q=''){let list=movies.filter(m=>(m.title+' '+m.genre+' '+m.type).toLowerCase().includes(q.toLowerCase()));return '<h1 class="pageTitle">Search</h1><p class="muted">'+(q?'Results for “'+esc(q)+'”':'Search the Netfinder catalog.')+'</p><div class="section">'+(list.length?cards(list):'<div class="empty">No matches found.</div>')+'</div>'}
function detail(id){let m=movies.find(x=>x.id===id);if(!m)return;history=[m.id,...history.filter(x=>x!==m.id)].slice(0,20);save();render('movie',id)}
function details(m){let inList=watch.includes(m.id);return '<div class="detail"><div class="detailPoster"><img src="'+url(m.poster,900)+'" alt="'+esc(m.title)+'"></div><div><div class="eyebrow">'+m.type+' · '+m.genre+'</div><h1>'+m.title+'</h1><div class="kv"><span>'+m.year+'</span><span>★ '+m.rating+'/10</span><span>HD</span></div><p>'+m.desc+'</p><div class="actions"><button class="btn" onclick="toggleWatch(\''+m.id+'\')">'+(inList?'✓ In my list':'＋ Add to my list')+'</button><button class="btn alt" onclick="go(\'home\')">← Back</button></div><div class="section"><h2>About this title</h2><p>Netfinder uses a lightweight catalog in this standalone build. Connect a movie-data provider later without changing the interface.</p></div></div></div>'}
function listPage(title,ids){let list=ids.map(id=>movies.find(m=>m.id===id)).filter(Boolean);return '<h1 class="pageTitle">'+title+'</h1>'+(list.length?cards(list):'<div class="empty">Nothing here yet.<br><br><button class="btn" onclick="go(\'discover\')">Discover titles</button></div>')}
function settings(){return '<h1 class="pageTitle">Settings</h1><div class="empty" style="text-align:left"><h2>Netfinder</h2><p class="muted">Standalone, installable movie discovery app.</p><hr style="border-color:var(--line);border-width:1px 0 0;margin:25px 0"><p><b>Offline shell</b><br><span class="muted">The app shell is cached for repeat visits.</span></p><p><b>Your data</b><br><span class="muted">Watchlist and history stay in this browser.</span></p><button class="btn" onclick="localStorage.clear();watch=[];history=[];toast(\'Local data cleared\');render()">Clear local data</button></div>'}
function profile(){return '<h1 class="pageTitle">Profile</h1><div class="empty"><div style="font-size:45px">◉</div><h2>Your Netfinder</h2><p>Keep track of what you want to watch and what you have opened.</p><div class="actions" style="justify-content:center"><button class="btn" onclick="go(\'watchlist\')">'+watch.length+' saved</button><button class="btn alt" onclick="go(\'history\')">'+history.length+' history</button></div></div>'}
function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(s){let x=document.getElementById('toast');x.textContent=s;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1800)}
function toggleWatch(id){watch=watch.includes(id)?watch.filter(x=>x!==id):[id,...watch];save();toast(watch.includes(id)?'Added to My List':'Removed from My List');render()}
function filterGenre(g){let list=g==='All'?movies:movies.filter(m=>m.genre===g);document.getElementById('discoverGrid').innerHTML=cards(list)}
function render(type,arg){let p=type||location.hash.replace(/^#\//,'').split('/')[0]||'home';let a=arg||decodeURIComponent(location.hash.split('/')[2]||'');let out=p==='home'?home():p==='discover'?discover():p==='search'?searchPage(a):p==='genre'?genre(a):p==='watchlist'?listPage('My List',watch):p==='history'?listPage('History',history):p==='profile'?profile():p==='settings'?settings():p==='movie'?(details(movies.find(m=>m.id===a))||'<div class="empty">Title not found.</div>'):'<div class="empty">Page not found.</div>';document.getElementById('app').innerHTML=out;nav(p)}
function nav(p){let items=[['home','⌂','Home'],['discover','◈','Discover'],['watchlist','♡','My List'],['profile','◉','Profile']];document.getElementById('nav').innerHTML=items.map(x=>'<button class="'+(p===x[0]?'on':'')+'" onclick="go(\''+x[0]+'\')">'+x[2]+'</button>').join('')+'<button onclick="go(\'settings\')">Settings</button>';document.getElementById('mobileNav').innerHTML=items.map(x=>'<button class="'+(p===x[0]?'on':'')+'" onclick="go(\''+x[0]+'\')"><b>'+x[1]+'</b>'+x[2]+'</button>').join('')}
document.getElementById('search').addEventListener('keydown',e=>{if(e.key==='Enter'){let q=e.target.value.trim();if(q)go('search',q)}});window.addEventListener('hashchange',()=>render());render();
let deferred;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;document.getElementById('install').style.display='block'});document.getElementById('install').onclick=async()=>{if(deferred){deferred.prompt();await deferred.userChoice;deferred=null;document.getElementById('install').style.display='none'}};
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
